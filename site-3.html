<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Создай свой смартфон</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14092b;--plum:#2a1450;--pump:#ff8a2b;--mint:#7ef0c4;--tx:#f4ecff;--mu:#b9a8d8;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 80% 0,#3b1d6e 0,var(--bg) 55%);color:var(--tx);font:16px/1.6 Manrope,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) 20px 48px}
h1{font:800 clamp(30px,8vw,48px)/1.05 Unbounded,sans-serif;margin:0 0 12px}
h2{font:600 17px Unbounded,sans-serif;margin:26px 0 8px}
p,.mu{color:var(--mu);margin:0 0 18px}
button{font:600 17px Manrope,sans-serif;background:var(--pump);color:#1a0b00;border:0;border-radius:14px;padding:15px 30px;box-shadow:0 8px 28px #ff8a2b55;cursor:pointer}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}button:disabled{opacity:.5}
ul{margin:0;padding-left:20px}li{margin:4px 0}
#g{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;display:none;z-index:9}
</style></head><body>
<main>
<h1>Создай свой смартфон</h1>
<p>Проектируй телефоны, выбирай чипы и ОС, продавай модели и гуляй по Хэллоуин-миру.</p>
<button id="play" disabled>Загрузка…</button>
<div class="mu" id="meta" style="margin-top:12px"></div>
<h2>Что нового</h2><ul id="notes"></ul>
</main>
<iframe id="g" allow="fullscreen" title="Игра"></iframe>
<script>
const SB="https://axiscisqaqpfsuobemnj.supabase.co",KEY="sb_publishable_SmIT8OkQHxwCOuiLKZqgEQ_znd8bC7i";
const H={apikey:KEY,Authorization:"Bearer "+KEY},$=s=>document.querySelector(s);let ver=0;
const api=q=>fetch(SB+"/rest/v1/releases?"+q,{headers:H,cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()});
api("select=v,notes,created_at&order=v.desc&limit=1").then(d=>{const r=d[0];if(!r){$("#play").textContent="Версий пока нет";return}
ver=r.v;$("#play").disabled=false;$("#play").textContent="Играть, версия "+r.v;
$("#meta").textContent="Выпуск от "+new Date(r.created_at).toLocaleDateString("ru-RU");
(r.notes||"").split("\n").filter(Boolean).forEach(t=>{const li=document.createElement("li");li.textContent=t;$("#notes").appendChild(li)})}).catch(()=>{$("#play").textContent="Нет связи с сервером"});
$("#play").onclick=async()=>{$("#play").disabled=true;$("#play").textContent="Запуск…";try{const d=await api("select=html&v=eq."+ver);const f=$("#g");f.onload=()=>{try{f.contentWindow.updApp=()=>location.reload()}catch(e){}};f.srcdoc=d[0].html;f.style.display="block"}catch(e){$("#play").disabled=false;$("#play").textContent="Ошибка, повторить"}};
</script></body></html>
